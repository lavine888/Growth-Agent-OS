[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "growth-agent-os"
version = "0.1.0"
description = "A minimal operating system for agentic growth workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
growth-os = "growth_agent_os.cli:main"

[tool.setuptools.packages.find]
include = ["growth_agent_os*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
