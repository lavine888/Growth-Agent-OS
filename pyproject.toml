[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "growth-agent-os"
version = "0.2.0"
description = "A measurable operating system for AI-native growth teams."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Growth Agent OS contributors"}]
dependencies = []

[project.scripts]
growth-os = "growth_agent_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
